name: "CI"

on:
  push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # v6.0.2 - Verified Jan 2026
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 21
        # v5.2.0 - Verified Jan 2026
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generating RSA Keys
        run: bash ./scripts/generate-rsa.sh

      - name: Run tests
        run: ./mvnw verify -Dspring.profiles.active=test

      - name: Upload fail tests report
        if: failure()
        # v3.2.2 - Verified March 2026
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf
        with:
          name: test-reports
          path: target/surefire-reports/*.xml






