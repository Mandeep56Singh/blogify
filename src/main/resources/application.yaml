spring:
  application:
    name: blogify
  profiles:
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 123


  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB


rsa:
  private-key: classpath:certs/private_key.pem
  public-key: classpath:certs/public_key.pem
  token-expire-in: 7d
