receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    const_labels:
      label1: value1

  debug:
    verbosity: detailed

# --- ADD THIS BLOCK ---
extensions:
  zpages:
    endpoint: "0.0.0.0:55679"
  health_check:
    endpoint: "0.0.0.0:13133"

service:
  # --- REGISTER EXTENSIONS HERE ---
  extensions: [zpages, health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]